
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAAMSC | Organizer Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #172033;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 32px 25px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 15px 45px #0005;
    }

    h1 {
      margin: 0;
      color: #173b75;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 23px;
      border: 0;
      border-radius: 9px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 17px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      color: #8992a3;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <main class="login-card">
    <h1>AAAMSC</h1>
    <p class="subtitle">Organizer Control Panel</p>

    <form id="loginForm">
      <label for="email">Organizer Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Login as Organizer
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="footer">
      AAAMSC Online Competition Platform
    </p>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      message.style.color = "#174ea6";
      message.textContent = "Verifying organizer account...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = credential.user;

        const adminRef = doc(db, "admins", user.uid);
        const adminSnapshot = await getDoc(adminRef);

        if (!adminSnapshot.exists()) {
          await signOut(auth);
          throw new Error("Access denied. This account is not an organizer.");
        }

        const adminData = adminSnapshot.data();

        if (adminData.role !== "admin" || adminData.active !== true) {
          await signOut(auth);
          throw new Error("Administrator access is inactive.");
        }
        
const idToken = await user.getIdToken();

const backendResponse = await fetch(
  "https://aaamsc-backend.jbrjubair7.workers.dev/api/admin-check",
  {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${idToken}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({})
  }
);

const backendResult = await backendResponse.json();

if (!backendResponse.ok || !backendResult.success) {
  const diagnosticText = backendResult.diagnostic
    ? JSON.stringify(backendResult.diagnostic, null, 2)
    : "No diagnostic information received.";

  await signOut(auth);

  throw new Error(
    (backendResult.error || "Organizer authorization failed.") +
    "\n\nDiagnostic:\n" +
    diagnosticText
  );
}


        message.style.color = "green";
        message.textContent = "Organizer verified successfully!";

        // Dashboard will be added after backend authorization is ready.
        button.disabled = true;

      } catch (error) {
        message.style.color = "#c62828";
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
