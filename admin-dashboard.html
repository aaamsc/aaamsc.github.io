
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10152f">
<title>AAAMSC Organizer Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:18px;
  font-family:Arial,sans-serif;
  background:#f1f3f9;
  color:#182039;
}

header{
  background:#10152f;
  color:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
}

header h2{margin:0 0 7px}
header p{margin:0;color:#cbd2eb}

button{
  border:0;
  padding:10px 13px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  margin:3px;
}

.primary{background:#243c9b;color:white}
.success{background:#16834b;color:white}
.danger{background:#c93636;color:white}
.neutral{background:#e4e8f2;color:#182039}

#dashboard{display:none}

.panel{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 2px 9px #0000000b;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:12px 0;
}

input,select{
  padding:12px;
  border:1px solid #ccd2df;
  border-radius:7px;
  font-size:15px;
  min-width:180px;
}

#message{
  padding:12px;
  border-radius:8px;
  margin:12px 0;
  display:none;
}

.participant{
  border:1px solid #e0e4ed;
  padding:15px;
  border-radius:10px;
  margin-top:12px;
  overflow-wrap:anywhere;
}

.participant h3{margin:0 0 10px}

.detail{
  margin:6px 0;
  font-size:14px;
  line-height:1.5;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#edf0f7;
  font-size:12px;
  margin:3px 3px 3px 0;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  margin-top:12px;
}

#loading{
  text-align:center;
  padding:25px;
}

@media(min-width:750px){
  body{max-width:1100px;margin:auto}
}
</style>
</head>

<body>

<header>
  <h2>AAAMSC Organizer Dashboard</h2>
  <p>AAAMSC Online Fest Management</p>
  <button id="logoutBtn" class="danger">Logout</button>
</header>

<div id="message"></div>

<div id="loading">Checking organizer authorization...</div>

<main id="dashboard">

  <section class="panel">
    <h2>Participants Management</h2>
    <p>Review registrations and verify payments.</p>

    <div class="controls">
      <input
        id="search"
        type="search"
        placeholder="Search name, email or ID"
      >

      <select id="statusFilter">
        <option value="all">All registrations</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>

      <button id="refreshBtn" class="primary">
        Refresh Participants
      </button>
    </div>

    <p id="participantCount">Loading participants...</p>

    <div id="participantsList"></div>
  </section>

</main>

<script type="module">

import { auth } from "./firebase.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


const API =
"https://aaamsc-backend.jbrjubair7.workers.dev";

const loading = document.getElementById("loading");
const dashboard = document.getElementById("dashboard");
const messageBox = document.getElementById("message");

const participantsList =
document.getElementById("participantsList");

let currentUser = null;
let participants = [];


function showMessage(message, error=false){

  messageBox.textContent = message;
  messageBox.style.display = "block";

  messageBox.style.background =
    error ? "#ffe5e5" : "#e1f5e9";

  messageBox.style.color =
    error ? "#a00000" : "#126333";
}


async function apiRequest(path, method="GET", body=null){

  if(!currentUser){
    throw new Error("Organizer is not logged in.");
  }

  const token = await currentUser.getIdToken(true);

  const response = await fetch(API + path,{
    method,
    headers:{
      "Authorization":"Bearer " + token,
      "Content-Type":"application/json"
    },
    ...(body ? {body:JSON.stringify(body)} : {})
  });

  const data = await response.json();

  if(!response.ok || data.success === false){
    throw new Error(data.message || "Request failed.");
  }

  return data;
}


async function loadParticipants(){

  participantsList.textContent = "Loading...";

  try{

    const data = await apiRequest(
      "/api/admin/participants"
    );

    participants = data.participants || [];

    renderParticipants();

    showMessage("Participant list updated.");

  }catch(error){

    participantsList.textContent = "";
    showMessage(error.message,true);

  }
}


function createElement(tag, text, className){

  const element = document.createElement(tag);

  if(text !== undefined){
    element.textContent = text;
  }

  if(className){
    element.className = className;
  }

  return element;
}


function addDetail(parent,label,value){

  const p = createElement(
    "p",
    label + ": " + (value ?? "Not provided"),
    "detail"
  );

  parent.appendChild(p);
}


function addAction(parent,label,className,callback){

  const button = createElement(
    "button",
    label,
    className
  );

  button.addEventListener("click",callback);

  parent.appendChild(button);
}


async function participantAction(id,action){

  const confirmed = confirm(
    "Are you sure you want to " + action +
    " this registration?"
  );

  if(!confirmed)return;

  try{

    await apiRequest(
      "/api/admin/participant-action",
      "POST",
      {id,action}
    );

    showMessage(
      "Registration " + action + " successful."
    );

    await loadParticipants();

  }catch(error){

    showMessage(error.message,true);

  }
}


async function paymentAction(id,action){

  const confirmed = confirm(
    "Are you sure you want to " + action +
    " this payment?"
  );

  if(!confirmed)return;

  try{

    await apiRequest(
      "/api/admin/payment-action",
      "POST",
      {id,action}
    );

    showMessage("Payment status updated.");

    await loadParticipants();

  }catch(error){

    showMessage(error.message,true);

  }
}


function renderParticipants(){

  const search =
    document.getElementById("search")
    .value.toLowerCase().trim();

  const filter =
    document.getElementById("statusFilter").value;

  participantsList.replaceChildren();

  const filtered = participants.filter(p=>{

    const text = [
      p.name,
      p.email,
      p.participant_id,
      p.class_level
    ].join(" ").toLowerCase();

    const matchesSearch = text.includes(search);

    const matchesStatus =
      filter === "all" || p.status === filter;

    return matchesSearch && matchesStatus;

  });

  document.getElementById("participantCount")
    .textContent =
    "Showing " + filtered.length +
    " of " + participants.length + " participants";


  if(filtered.length === 0){

    participantsList.appendChild(
      createElement("p","No participants found.")
    );

    return;
  }


  filtered.forEach(p=>{

    const card = createElement(
      "article",
      undefined,
      "participant"
    );

    card.appendChild(
      createElement("h3",p.name || "Unnamed participant")
    );

    const idText = p.participant_id || "Not assigned";

    addDetail(card,"Participant ID",idText);
    addDetail(card,"Email",p.email);
    addDetail(card,"Class",p.class_level);
    addDetail(card,"Section",p.section);
    addDetail(card,"Roll Number",p.roll_number);
    addDetail(card,"Competition",p.competition);
    addDetail(card,"Category",p.category);
    addDetail(card,"AAAMSC Member",p.aaamsc_member);
    addDetail(card,"Previous Participation",p.previous_participation);
    addDetail(card,"bKash Sender Number",p.bkash_sender_number);
    addDetail(card,"Transaction ID",p.bkash_transaction_id);
    addDetail(card,"Registration Date",p.created_at);

    const statuses = createElement("div");

    statuses.appendChild(
      createElement(
        "span",
        "Registration: " + p.status,
        "status"
      )
    );

    statuses.appendChild(
      createElement(
        "span",
        "Payment: " + p.payment_status,
        "status"
      )
    );

    card.appendChild(statuses);


    const actions = createElement(
      "div",
      undefined,
      "actions"
    );


    if(p.status === "pending"){

      addAction(
        actions,
        "Approve Registration",
        "success",
        ()=>participantAction(p.id,"approve")
      );

      addAction(
        actions,
        "Reject Registration",
        "danger",
        ()=>participantAction(p.id,"reject")
      );

    }


    if(p.payment_status === "pending"){

      addAction(
        actions,
        "Verify Payment",
        "primary",
        ()=>paymentAction(p.id,"verify")
      );

      addAction(
        actions,
        "Reject Payment",
        "danger",
        ()=>paymentAction(p.id,"reject")
      );

    }


    card.appendChild(actions);
    participantsList.appendChild(card);

  });

}


// Search and filters

document.getElementById("search")
.addEventListener("input",renderParticipants);

document.getElementById("statusFilter")
.addEventListener("change",renderParticipants);

document.getElementById("refreshBtn")
.addEventListener("click",loadParticipants);


// Organizer authentication

onAuthStateChanged(auth,async user=>{

  if(!user){

    window.location.href = "admin-login.html";
    return;

  }

  currentUser = user;

  try{

    await apiRequest("/api/admin-check","POST",{});

    loading.style.display = "none";
    dashboard.style.display = "block";

    await loadParticipants();

  }catch(error){

    showMessage(
      "Organizer verification failed: " + error.message,
      true
    );

    await signOut(auth);

    window.location.href = "admin-login.html";

  }

});


// Logout

document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

  await signOut(auth);

  window.location.href = "admin-login.html";

});

</script>

</body>
</html>
